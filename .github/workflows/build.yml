name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unzip project
        run: unzip ghar-wala-app.zip -d app-source
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: cd app-source && npm install
      - name: Build APK
        run: cd app-source/android && ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghar-wala-apk
          path: app-source/android/app/build/outputs/apk/release/app-release.apk
